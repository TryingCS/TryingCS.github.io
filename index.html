<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            padding: 4rem 2rem; 
            background: var(--bg);
            /* Mesh gradient background */
            background-image: radial-gradient(at 40% 20%, hsla(28,100%,74%,0.15) 0px, transparent 50%),
                              radial-gradient(at 80% 0%, hsla(189,100%,56%,0.1) 0px, transparent 50%),
                              radial-gradient(at 0% 50%, hsla(355,100%,93%,0.05) 0px, transparent 50%),
                              radial-gradient(at 80% 50%, hsla(340,100%,76%,0.05) 0px, transparent 50%),
                              radial-gradient(at 0% 100%, hsla(22,100%,77%,0.1) 0px, transparent 50%),
                              radial-gradient(at 80% 100%, hsla(242,100%,70%,0.1) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 { 
            margin-bottom: 3rem; 
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 2rem; 
            max-width: 1100px; 
            width: 100%;
            margin: 0 auto; 
        }
        .card { 
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2rem; 
            border-radius: 1.2rem; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            text-align: left;
            position: relative;
        }
        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 40px 0 rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.3);
        }
        .card-icon {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        .card a { 
            text-decoration: none; 
            color: var(--text-main); 
            font-weight: 600; 
            font-size: 1.3rem; 
            display: block;
            margin-bottom: 0.5rem;
            transition: color 0.2s;
        }
        .card a:hover {
            color: var(--accent);
        }
        .card p { 
            color: var(--text-sub); 
            margin: 0; 
            line-height: 1.5;
        }
        .tags {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .tag {
            background: rgba(255,255,255,0.1);
            color: var(--text-sub);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>Project Dashboard</h1>
    <div class="grid">
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-gem"></i></div>
            <a href="https://tryingcs.github.io/kunuz/">
                Kunuz <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.9rem; vertical-align: middle; opacity: 0.6;"></i>
            </a>
            <p>Find the gems hidden in plain sight.</p>
            <div class="tags">
                <span class="tag">Web</span>
                <span class="tag">Live</span>
            </div>
        </div>
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <a href="https://nlsykg2wsg4vm.kimi.page/">
                CourseCraft <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.9rem; vertical-align: middle; opacity: 0.6;"></i>
            </a>
            <p>Learn by doing, not just watching.</p>
            <div class="tags">
                <span class="tag">Education</span>
                <span class="tag">Interactive</span>
            </div>
        </div>
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-book"></i></div>
            <a href="https://computer-science-engineering-notes.vercel.app/">
                CSEN Notes <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.9rem; vertical-align: middle; opacity: 0.6;"></i>
            </a>
            <p>Some of my notes presented in a wiki-like format.</p>
            <div class="tags">
                <span class="tag">CS</span>
                <span class="tag">Vercel</span>
            </div>
        </div>
    </div>
</body>
</html>
