<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            padding: 4rem 2rem; 
            background: #f4f4f9; 
            color: #333;
            margin: 0;
        }
        h1 { margin-bottom: 3rem; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 2rem; 
            max-width: 100rem; 
            margin: 0 auto; 
        }
        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 0.8rem; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card a { 
            text-decoration: none; 
            color: #0056b3; 
            font-weight: 600; 
            font-size: 1.25rem; 
        }
        .card p { color: #666; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Project Dashboard</h1>
    <div class="grid">
        <div class="card">
            <a href="https://tryingcs.github.io/repo-one/">kunuz</a>
            <p>See the everyday things in a new way.</p>
        </div>
        <div class="card">
            <a href="https://tryingcs.github.io/r/">Project Two</a>
            <p>Brief description of the second project.</p>
        </div>
    </div>
</body>
</html>
